spring.application.name=Delivery and Distribution
# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/vegetable_waste_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Minunavi@2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
