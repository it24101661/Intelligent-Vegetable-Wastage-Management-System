<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management - Vegetable Wastage Management System</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; background:#f5f7f5; color:#1f2937; }
        table { width:100%; border-collapse:collapse; }
        th { background:#f0f4f0; padding:10px 14px; text-align:left; font-size:12px; font-weight:600; color:#6b7280; border-bottom:1px solid #e5e7eb; }
        td { padding:10px 14px; font-size:13px; border-bottom:1px solid #f3f4f6; }
        tr:hover td { background:#f9fafb; }
        .badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; }
        .badge-Pending { background:#fef3c7; color:#92400e; }
        .badge-Confirmed { background:#dbeafe; color:#1e40af; }
        .badge-Packed { background:#ede9fe; color:#5b21b6; }
        .badge-Shipped { background:#d1fae5; color:#065f46; }
        .badge-Delivered { background:#dcfce7; color:#166534; }
        .badge-Cancelled { background:#fee2e2; color:#991b1b; }
        input, select, textarea { padding:8px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; font-family:inherit; outline:none; width:100%; }
        input:focus, select:focus, textarea:focus { border-color:#16a34a; box-shadow:0 0 0 2px rgba(22,163,74,0.15); }
        .btn { padding:8px 16px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; border:none; display:inline-flex; align-items:center; gap:6px; font-family:inherit; }
        .btn-green { background:#16a34a; color:white; }
        .btn-green:hover { background:#15803d; }
        .btn-red { background:#dc2626; color:white; }
        .btn-red:hover { background:#b91c1c; }
        .btn-blue { background:#2563eb; color:white; }
        .btn-blue:hover { background:#1d4ed8; }
        .btn-outline { background:white; border:1px solid #d1d5db; color:#374151; }
        .btn-outline:hover { background:#f9fafb; }
        .btn-sm { padding:5px 12px; font-size:12px; }
        .btn:disabled { opacity:0.4; cursor:not-allowed; }
        .card { background:white; border:1px solid #e5e7eb; border-radius:8px; }
        .toast { position:fixed; top:20px; right:20px; padding:12px 20px; border-radius:8px; font-size:13px; font-weight:500; z-index:9999; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
        .toast-ok { background:#dcfce7; color:#166534; border-left:4px solid #16a34a; }
        .toast-err { background:#fee2e2; color:#991b1b; border-left:4px solid #dc2626; }
        .toast-warn { background:#fef3c7; color:#92400e; border-left:4px solid #f59e0b; }
        .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:1000; display:flex; align-items:center; justify-content:center; }
        .modal-box { background:white; border-radius:10px; max-width:560px; width:92%; max-height:85vh; overflow-y:auto; }
        .sidebar { width:230px; min-height:calc(100vh - 56px); background:white; border-right:1px solid #e5e7eb; }
        .sidebar a { display:flex; align-items:center; gap:10px; padding:10px 16px; font-size:13px; color:#4b5563; text-decoration:none; cursor:pointer; }
        .sidebar a:hover { background:#f0fdf4; color:#16a34a; }
        .sidebar a.active { background:#dcfce7; color:#16a34a; font-weight:600; }
        .sidebar a svg { width:16px; height:16px; flex-shrink:0; }
        .sidebar .sep { height:1px; background:#e5e7eb; margin:6px 12px; }
        .qty-box { display:inline-flex; border:1px solid #d1d5db; border-radius:6px; overflow:hidden; }
        .qty-box button { width:30px; height:30px; border:none; background:#f9fafb; cursor:pointer; font-size:13px; }
        .qty-box button:hover { background:#dcfce7; }
        .qty-box span { width:40px; height:30px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; border-left:1px solid #d1d5db; border-right:1px solid #d1d5db; }
        .stock-bar { height:4px; background:#e5e7eb; border-radius:2px; margin-top:4px; }
        .stock-fill { height:4px; border-radius:2px; }
        .hidden { display:none !important; }
        .icon { display:inline-flex; align-items:center; justify-content:center; }
        svg.ic { width:14px; height:14px; vertical-align:middle; }
    </style>
</head>
<body>

<div id="toast"></div>
<div id="modal"></div>

<!-- LOGIN -->
<div id="loginPage" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f7f5">
    <div class="card" style="padding:32px;width:380px">
        <div style="text-align:center;margin-bottom:24px">
            <div style="width:48px;height:48px;background:#dcfce7;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px">
                <!-- leaf icon -->
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 4 13c0-3.87 3.13-7 7-7h6a7 7 0 0 1 7 7 7 7 0 0 1-7 7z"/><path d="M11 20c0-4.97 4-9 9-9"/></svg>
            </div>
            <h2 style="font-size:18px;font-weight:700">Order Management</h2>
            <p style="font-size:12px;color:#6b7280;margin-top:4px">Intelligent Vegetable Wastage Management System</p>
        </div>
        <div style="margin-bottom:16px">
            <label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px">Role</label>
            <select id="loginRole"><option value="customer">Customer</option><option value="farmer">Farmer</option><option value="admin">Admin</option></select>
        </div>
        <div style="margin-bottom:16px">
            <label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px">Username</label>
            <input type="text" id="loginUser" value="john_silva">
        </div>
        <div style="margin-bottom:20px">
            <label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px">Password</label>
            <input type="password" id="loginPass" value="pass123">
        </div>
        <button class="btn btn-green" style="width:100%;justify-content:center;padding:10px" onclick="doLogin()">Sign In</button>
    </div>
</div>

<!-- APP -->
<div id="appPage" style="display:none">

        <div style="display:flex;align-items:center;gap:12px;flex:1">
            <button onclick="document.getElementById('sb').classList.toggle('hidden')" style="display:none;background:none;border:none;font-size:16px;color:#374151;cursor:pointer" id="menuBtn">
                <!-- bars icon -->
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 4 13c0-3.87 3.13-7 7-7h6a7 7 0 0 1 7 7 7 7 0 0 1-7 7z"/><path d="M11 20c0-4.97 4-9 9-9"/></svg>
            <span style="font-weight:700;font-size:14px">Order Management</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
            <button onclick="goTo('notifications')" style="position:relative;background:none;border:none;cursor:pointer;color:#6b7280;display:flex;align-items:center">
                <!-- bell icon -->
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>

            </button>
            <div style="display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid #e5e7eb">
                <div id="avatar" style="width:32px;height:32px;background:#16a34a;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">J</div>
                <div>
                    <div id="dispName" style="font-size:13px;font-weight:600;line-height:1.2">John Silva</div>
                    <div id="dispRole" style="font-size:11px;color:#16a34a">Customer</div>

        </div>
    </div>
    <div style="display:flex">

        <main id="content" style="flex:1;padding:20px;min-height:calc(100vh - 56px)"></main>
    </div>
</div>

/* ===== HELPERS ===== */
function rs(n) { return 'Rs. ' + n.toLocaleString(); }
function badge(s) { return '<span class="badge badge-'+s+'">'+s+'</span>'; }
function vdot(n) { return '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+(VCOL[n]||'#9ca3af')+';margin-right:4px"></span>'; }
function ic(name,size) { return icon(name, size||14); }
function toast(msg, type) {
    type = type || 'ok';
    var d = document.getElementById('toast');
    d.className = 'toast toast-' + type;
    d.textContent = msg;
    setTimeout(function(){ d.className = 'toast'; }, 3000);
}
function openModal(html) {
    document.getElementById('modal').innerHTML = '<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal-box">' + html + '</div></div>';
}
function closeModal() { document.getElementById('modal').innerHTML = ''; }
function nextId(arr) { return Math.max.apply(null, arr.map(function(x){return x.id;})) + 1; }

/* ===== AUTH ===== */
function doLogin() {
    var role = document.getElementById('loginRole').value;
    var name = document.getElementById('loginUser').value.trim() || 'User';
    S.role = role;
    S.user = { id: role==='customer'?1:role==='farmer'?1:0, name: name.split('_').map(function(w){return w[0].toUpperCase()+w.slice(1);}).join(' '), role: role };
    S.cart = [];
    S.catFilter = 'All';
    loadApp();
}

function doLogout() {
    S = { role:null, user:null, page:null, cart:[], orders:[], vegs:[], notifs:[], suggestions:[], catFilter:'All' };
    document.getElementById('appPage').style.display = 'none';
    document.getElementById('loginPage').style.display = 'flex';
}

function refreshOrders() {
    if (S.role === 'customer') S.orders = ORDERS.filter(function(o){return o.cid === S.user.id;});
    else if (S.role === 'farmer') S.orders = ORDERS.filter(function(o){return o.fid === S.user.id;});
    else S.orders = ORDERS.slice();
}

function refreshVegs() { S.vegs = VEGS.slice(); }

function loadApp() {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('appPage').style.display = 'block';
    document.getElementById('dispName').textContent = S.user.name;
    document.getElementById('dispRole').textContent = S.role[0].toUpperCase() + S.role.slice(1);
    document.getElementById('avatar').textContent = S.user.name[0];

    refreshVegs();
    refreshOrders();
    S.notifs = MOCK ? (S.role==='farmer'? NOTIFS.filter(function(n){return n.type==='new'||n.type==='cancel';}) : S.role==='admin'? NOTIFS.slice() : NOTIFS.filter(function(n){return n.type!=='new'&&n.type!=='cancel';})) : [];
    S.suggestions = SUGGESTIONS.slice();
    updateDot();

    var html = '';
    MENUS[S.role].forEach(function(m) {
        if (m.sep) { html += '<div class="sep"></div>'; return; }
        html += '<a data-p="'+m[0]+'" onclick="goTo(\''+m[0]+'\')">'+ic(m[1],16)+m[2]+'</a>';
    });
    document.getElementById('sidebarNav').innerHTML = html;

    if (window.innerWidth >= 768) document.getElementById('sb').classList.remove('hidden');
    var first = MENUS[S.role].filter(function(m){return !m.sep;})[0][0];
    goTo(first);
}

function updateDot() { document.getElementById('notifDot').style.display = S.notifs.some(function(n){return !n.read;}) ? 'block' : 'none'; }

function goTo(p) {
    S.page = p;
    document.querySelectorAll('#sidebarNav a').forEach(function(a){ a.classList.toggle('active', a.dataset.p===p); });
    if (window.innerWidth < 768) document.getElementById('sb').classList.add('hidden');
    var pages = { 'place-order':pgPlaceOrder, 'my-orders':pgMyOrders, 'history':pgHistory, 'ai':pgAI, 'notifications':pgNotifs, 'incoming':pgIncoming, 'fulfill':pgFulfill, 'all-orders':pgAllOrders, 'analytics':pgAnalytics, 'cancellations':pgCancellations, 'stocks':pgStocks };
    if (pages[p]) pages[p](); else document.getElementById('content').innerHTML = '<p>Not found</p>';
}

function addToCart(vid, qty) {
    if (qty <= 0) { S.cart = S.cart.filter(function(c){return c.vid!==vid;}); }
    else {
        var v = S.vegs.find(function(x){return x.id===vid;});
        if (qty > v.stock) { toast('Only '+v.stock+' kg available','warn'); qty = v.stock; }
        var ex = S.cart.find(function(c){return c.vid===vid;});
        if (ex) ex.qty = qty;
        else S.cart.push({vid:v.id, name:v.name, qty:qty, price:v.price, stock:v.stock, farmer:v.farmer, fid:v.fid});
    }
    goTo('place-order');
}

function placeOrder() {
    if (!S.cart.length) { toast('Cart is empty','warn'); return; }
    var dd = document.getElementById('dd').value;
    var addr = document.getElementById('addr').value.trim();
    if (!dd) { toast('Select delivery date','warn'); return; }
    if (!addr) { toast('Enter address','warn'); return; }
    var bad = S.cart.find(function(c){return c.qty>c.stock;});
    if (bad) { toast(bad.name+': exceeds stock','err'); return; }
    var total = S.cart.reduce(function(s,i){return s+i.qty*i.price;},0);
    var nid = 'ORD-' + (1000 + ORDERS.length + 1);
    var cid = S.user.id, cname = S.user.name;
    if (S.role === 'admin') { cname = document.getElementById('adminCname').value.trim() || 'Admin Order'; cid = parseInt(document.getElementById('adminCid').value) || 0; }
    ORDERS.push({ id:nid, cid:cid, cname:cname, fid:S.cart[0].fid, fname:S.cart[0].farmer, items:S.cart.map(function(c){return {vid:c.vid,name:c.name,qty:c.qty,price:c.price};}), total:total, status:'Pending', dd:dd, od:new Date().toISOString().split('T')[0], addr:addr });
    refreshVegs(); refreshOrders(); S.cart = [];
    toast('Order '+nid+(S.role==='admin'?' created':' placed')+'!');
    goTo(S.role==='admin'?'all-orders':'my-orders');
}

    displayVegs.map(function(v){
        var low = v.stock < 120;
        return '<tr><td>'+v.id+'</td><td style="font-weight:600">'+vdot(v.name)+v.name+'</td><td>'+v.category+'</td>'+(S.role==='admin'?'<td>'+v.farmer+'</td>':'')+'<td>'+rs(v.price)+'</td><td>'+v.stock+'</td><td>'+(low?'<span class="badge badge-Cancelled">Low</span>':'<span class="badge badge-Delivered">OK</span>')+'</td><td style="white-space:nowrap"><button class="btn btn-outline btn-sm" onclick="stockModal('+v.id+')">'+ic('edit',11)+' Edit</button> <button class="btn btn-red btn-sm" onclick="deleteStock('+v.id+')">'+ic('trash',11)+'</button></td></tr>';
    }).join('') +
    '</tbody></table></div>';
}

function stockModal(vid) {
    var v = vid ? S.vegs.find(function(x){return x.id===vid;}) : null;
    var isEdit = !!v;
    var farmerLocked = S.role === 'farmer';
    var farmerId = farmerLocked ? S.user.id : (v ? v.fid : 1);
    openModal('<div style="padding:20px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 style="font-size:16px;font-weight:700">'+(isEdit?'Edit Stock: '+v.name:'Add New Stock')+'</h3><button onclick="closeModal()" style="background:none;border:none;cursor:pointer;color:#6b7280">'+ic('times',18)+'</button></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">' +
        '<div><label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px">Vegetable Name</label><input id="sName" value="'+(v?v.name:'')+'" placeholder="e.g. Tomatoes"></div>' +
        '<div><label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px">Category</label><select id="sCat"><option value="Vegetable"'+(v&&v.category==='Vegetable'?' selected':'')+'>Vegetable</option><option value="Root"'+(v&&v.category==='Root'?' selected':'')+'>Root</option><option value="Leafy"'+(v&&v.category==='Leafy'?' selected':'')+'>Leafy</option><option value="Legume"'+(v&&v.category==='Legume'?' selected':'')+'>Legume</option></select></div>' +
        '<div><label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px">Farmer</label><select id="sFarmer"'+(farmerLocked?' disabled':'')+'>'+FARMERS.map(function(f){return '<option value="'+f.id+'"'+(farmerId===f.id?' selected':'')+'>'+f.name+'</option>';}).join('')+'</select>'+(farmerLocked?'<div style="font-size:10px;color:#9ca3af;margin-top:2px">Locked to your account</div>':'')+'</div>' +
        '<div><label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px">Price per kg (Rs.)</label><input id="sPrice" type="number" value="'+(v?v.price:'')+'" placeholder="e.g. 220" min="0"></div>' +
        '<div style="grid-column:span 2"><label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px">Available Stock (kg)</label><input id="sStock" type="number" value="'+(v?v.stock:'')+'" placeholder="e.g. 200" min="0"></div>' +
    '</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-green" onclick="saveStock('+(vid||0)+')">'+ic('save')+' '+(isEdit?'Update':'Create')+'</button></div></div>');
}

function saveStock(vid) {
    var name = document.getElementById('sName').value.trim();
    var cat = document.getElementById('sCat').value;
    var fid = S.role==='farmer' ? S.user.id : parseInt(document.getElementById('sFarmer').value);
    var price = parseFloat(document.getElementById('sPrice').value);
    var stock = parseInt(document.getElementById('sStock').value);
    var farmer = FARMERS.find(function(f){return f.id===fid;});
    if (!name) { toast('Enter vegetable name','warn'); return; }
    if (!price || price <= 0) { toast('Enter valid price','warn'); return; }
    if (!stock || stock < 0) { toast('Enter valid stock','warn'); return; }
    if (vid) {
        var v = VEGS.find(function(x){return x.id===vid;});
        if (v) { v.name=name; v.category=cat; v.fid=fid; v.farmer=farmer.name; v.price=price; v.stock=stock; }
        toast(name+' stock updated');
    } else {
        var newId = nextId(VEGS);
        VEGS.push({ id:newId, name:name, category:cat, price:price, stock:stock, farmer:farmer.name, fid:fid });
        VCOL[name] = '#' + (Math.floor(Math.random()*0x888888)+0x444444).toString(16);
        toast(name+' stock created');
    }
    refreshVegs(); closeModal(); goTo('stocks');
}

function deleteStock(vid) {
    var v = S.vegs.find(function(x){return x.id===vid;}); if(!v) return;
    openModal('<div style="padding:20px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 style="font-size:16px;font-weight:700">Delete Stock</h3><button onclick="closeModal()" style="background:none;border:none;cursor:pointer;color:#6b7280">'+ic('times',18)+'</button></div><div style="background:#fee2e2;padding:10px;border-radius:6px;font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:6px"><span style="color:#dc2626">'+ic('exclamation-triangle')+'</span>Delete <strong>'+v.name+'</strong> stock entry?</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-outline" onclick="closeModal()">Keep</button><button class="btn btn-red" onclick="doDeleteStock('+vid+')">'+ic('trash')+' Delete</button></div></div>');
}
function doDeleteStock(vid) { var idx=VEGS.findIndex(function(x){return x.id===vid;}); if(idx!==-1) VEGS.splice(idx,1); refreshVegs(); closeModal(); toast('Stock deleted','warn'); goTo('stocks'); }

/* ===== SHARED MODALS ===== */
function detailModal(oid) {
    var o = ORDERS.find(function(x){return x.id===oid;}); if(!o) return;
    openModal('<div style="padding:20px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div><h3 style="font-size:16px;font-weight:700">'+o.id+'</h3><p style="font-size:11px;color:#6b7280">Ordered: '+o.od+'</p></div><button onclick="closeModal()" style="background:none;border:none;cursor:pointer;color:#6b7280">'+ic('times',18)+'</button></div><div style="margin-bottom:14px">'+badge(o.status)+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px"><div style="background:#f9fafb;padding:10px;border-radius:6px"><div style="font-size:10px;color:#6b7280">Customer</div><div style="font-size:13px;font-weight:600">'+o.cname+'</div></div><div style="background:#f9fafb;padding:10px;border-radius:6px"><div style="font-size:10px;color:#6b7280">Farmer</div><div style="font-size:13px;font-weight:600">'+o.fname+'</div></div><div style="background:#f9fafb;padding:10px;border-radius:6px"><div style="font-size:10px;color:#6b7280">Delivery Date</div><div style="font-size:13px;font-weight:600">'+o.dd+'</div></div><div style="background:#f9fafb;padding:10px;border-radius:6px"><div style="font-size:10px;color:#6b7280">Address</div><div style="font-size:13px;font-weight:600">'+o.addr+'</div></div></div><div style="margin-bottom:14px"><div style="font-size:11px;font-weight:700;color:#6b7280;margin-bottom:6px">ITEMS</div><table><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr></thead><tbody>'+o.items.map(function(i){return '<tr><td>'+vdot(i.name)+i.name+'</td><td>'+i.qty+' kg</td><td>'+rs(i.price)+'/kg</td><td style="font-weight:600">'+rs(i.qty*i.price)+'</td></tr>';}).join('')+'</tbody></table></div><div style="display:flex;justify-content:space-between;padding-top:10px;border-top:2px solid #e5e7eb"><span style="font-weight:700">Total</span><span style="font-weight:800;font-size:18px;color:#16a34a">'+rs(o.total)+'</span></div>'+(o.reason?'<div style="margin-top:12px;background:#fee2e2;padding:10px;border-radius:6px"><div style="font-size:11px;font-weight:700;color:#dc2626">Cancel Reason</div><div style="font-size:12px;color:#991b1b">'+o.reason+'</div></div>':'')+'</div>');
}

function cancelModal(oid) {
    openModal('<div style="padding:20px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="font-size:16px;font-weight:700">Cancel Order</h3><button onclick="closeModal()" style="background:none;border:none;cursor:pointer;color:#6b7280">'+ic('times',18)+'</button></div><div style="background:#fef3c7;padding:10px;border-radius:6px;font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:6px"><span style="color:#f59e0b">'+ic('exclamation-triangle')+'</span>Cancelling <strong>'+oid+'</strong> cannot be undone.</div><label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px">Reason</label><select id="cr" style="margin-bottom:8px"><option value="">Select reason</option><option>Found cheaper alternative</option><option>Order placed by mistake</option><option>Delivery date too far</option><option>Change in requirement</option><option>Other</option></select><textarea id="crt" rows="2" placeholder="Details (optional)" style="margin-bottom:14px;resize:vertical"></textarea><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-outline" onclick="closeModal()">Keep</button><button class="btn btn-red" onclick="doCancel(\''+oid+'\')">Confirm Cancel</button></div></div>');
}
function doCancel(oid) { var r1=document.getElementById('cr').value,r2=document.getElementById('crt').value; if(!r1&&!r2){toast('Provide a reason','warn');return;} var o=ORDERS.find(function(x){return x.id===oid;}); if(o){o.status='Cancelled';o.reason=r1||r2;} refreshOrders(); closeModal(); toast(oid+' cancelled','warn'); goTo(S.page); }

function editModal(oid) {
    var o = ORDERS.find(function(x){return x.id===oid;}); if(!o) return;
    openModal('<div style="padding:20px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="font-size:16px;font-weight:700">Edit '+oid+'</h3><button onclick="closeModal()" style="background:none;border:none;cursor:pointer;color:#6b7280">'+ic('times',18)+'</button></div><div style="background:#dbeafe;padding:10px;border-radius:6px;font-size:12px;margin-bottom:14px;display:flex;align-items:center;gap:6px"><span style="color:#2563eb">'+ic('info-circle')+'</span>Only pending orders can be edited.</div>'+o.items.map(function(item,idx){var v=S.vegs.find(function(x){return x.id===item.vid;});var cs=v?v.stock:999;return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:#f9fafb;border-radius:6px;margin-bottom:6px"><div>'+vdot(item.name)+'<span style="font-weight:600;font-size:13px">'+item.name+'</span><span style="font-size:11px;color:#6b7280;display:block">Stock: '+cs+' kg</span></div><input type="number" id="eq'+idx+'" value="'+item.qty+'" min="1" max="'+cs+'" style="width:70px;text-align:center"></div>';}).join('')+'<div style="margin-top:10px"><label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px">Delivery Date</label><input type="date" id="edd" value="'+o.dd+'" style="margin-bottom:14px"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-outline" onclick="closeModal()">Discard</button><button class="btn btn-green" onclick="doEdit(\''+oid+'\')">Save</button></div></div>');
}
function doEdit(oid) { var o=ORDERS.find(function(x){return x.id===oid;}); var ni=o.items.map(function(item,idx){var nq=parseInt(document.getElementById('eq'+idx).value)||item.qty;return {vid:item.vid,name:item.name,qty:nq,price:item.price};}); for(var i=0;i<ni.length;i++){var v=S.vegs.find(function(x){return x.id===ni[i].vid;});if(v&&ni[i].qty>v.stock){toast(ni[i].name+': only '+v.stock+' kg','err');return;}} o.items=ni;o.total=ni.reduce(function(s,i){return s+i.qty*i.price;},0);o.dd=document.getElementById('edd').value; refreshOrders(); closeModal(); toast(oid+' updated'); goTo(S.page); }

/* ===== RESPONSIVE ===== */
function checkWidth() { var sb=document.getElementById('sb'),mb=document.getElementById('menuBtn'); if(window.innerWidth>=768){sb.classList.remove('hidden');mb.style.display='none';}else{sb.classList.add('hidden');mb.style.display='flex';} }
window.addEventListener('resize', checkWidth);
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });
</script>
</body>
</html>
