<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Stock - Farmer Stock Management</title>
    <link rel="stylesheet" href="/css/add-stock.css">
</head>
<body>
<div class="container">
    <div class="form-wrapper">
        <div class="form-header">
            <h1>Add Newly Harvested Vegetables</h1>
            <p class="subtitle">Register your newly harvested vegetables to the marketplace</p>
        </div>

        <form id="addStockForm" class="form-group">
            <!-- Row 1: Farmer ID & Vegetable Name -->
            <div class="form-row">
                <div class="form-section">
                    <label for="farmerId">Farmer ID <span class="required">*</span></label>
                    <input
                            type="text"
                            id="farmerId"
                            name="farmerId"
                            placeholder="e.g., F001"
                            required
                    >
                    <small>Your unique farmer identification number</small>
                </div>

                <div class="form-section">
                    <label for="vegetableName">Vegetable Name <span class="required">*</span></label>
                    <input
                            type="text"
                            id="vegetableName"
                            name="vegetableName"
                            placeholder="e.g., Tomato, Carrot"
                            required
                    >
                </div>
            </div>

            <!-- Row 2: Category & Harvest Date -->
            <div class="form-row">
                <div class="form-section">
                    <label for="category">Category <span class="required">*</span></label>
                    <select id="category" name="category" required>
                        <option value="">-- Select Category --</option>
                        <option value="Leafy"> Leafy (Spinach, Lettuce)</option>
                        <option value="Root"> Root (Carrot, Turnip)</option>
                        <option value="Fruit"> Fruit (Tomato, Cucumber)</option>
                    </select>
                </div>

                <div class="form-section">
                    <label for="harvestDate">Harvest Date <span class="required">*</span></label>
                    <input
                            type="date"
                            id="harvestDate"
                            name="harvestDate"
                            required
                    >
                </div>
            </div>

            <!-- Row 3: Quantity & Price -->
            <div class="form-row">
                <div class="form-section">
                    <label for="quantityKg">Quantity (kg) <span class="required">*</span></label>
                    <input
                            type="number"
                            id="quantityKg"
                            name="quantityKg"
                            placeholder="Enter quantity in kg"
                            step="0.01"
                            min="0.1"
                            required
                    >
                </div>

                <div class="form-section">
                    <label for="pricePerKg">Price per kg (Rs.) <span class="required">*</span></label>
                    <input
                            type="number"
                            id="pricePerKg"
                            name="pricePerKg"
                            placeholder="Enter price"
                            step="0.01"
                            min="0.1"
                            required
                    >
                </div>
            </div>

            <!-- Row 4: Quality Grade -->
            <div class="form-section full-width">
                <label>Quality Grade <span class="required">*</span></label>
                <div class="quality-options">
                    <label class="radio-label">
                        <input
                                type="radio"
                                name="qualityGrade"
                                value="A"
                                required
                        >
                        <span class="grade-badge grade-a">Grade A</span>
                        <span class="grade-desc">Premium Quality</span>
                    </label>
                    <label class="radio-label">
                        <input
                                type="radio"
                                name="qualityGrade"
                                value="B"
                        >
                        <span class="grade-badge grade-b">Grade B</span>
                        <span class="grade-desc">Good Quality</span>
                    </label>
                    <label class="radio-label">
                        <input
                                type="radio"
                                name="qualityGrade"
                                value="C"
                        >
                        <span class="grade-badge grade-c">Grade C</span>
                        <span class="grade-desc">Standard Quality</span>
                    </label>
                </div>
            </div>

            <!-- Row 5: Expiry Estimate -->
            <div class="form-section full-width">
                <label for="expiryEstimate">Expiry/Spoilage Estimate <span class="optional">(Optional)</span></label>
                <input
                        type="date"
                        id="expiryEstimate"
                        name="expiryEstimate"
                >
                <small>Estimated date when vegetables may spoil</small>
            </div>

            <!-- Buttons -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary"> Add to Stock</button>
                <button type="reset" class="btn btn-secondary"> Clear Form</button>
                <a href="/" class="btn btn-tertiary"> Back to Home</a>
            </div>
        </form>

        <!-- Success Message -->
        <div id="successMessage" class="alert alert-success" style="display: none;">
            <span class="close-btn" onclick="closeAlert('successMessage')">&times;</span>
            <strong>✓ Success!</strong> <span id="successText"></span>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="alert alert-error" style="display: none;">
            <span class="close-btn" onclick="closeAlert('errorMessage')">&times;</span>
            <strong>✗ Error!</strong> <span id="errorText"></span>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="spinner" style="display: none;"></div>
    </div>
</div>

<script src="/js/add-stock.js"></script>
</body>
</html>
